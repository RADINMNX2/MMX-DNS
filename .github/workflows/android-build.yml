name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true
          link-to-sdk: true

      - name: Configure NDK Environment and local.properties
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > local.properties
          echo "NDK configured at: ${{ steps.setup-ndk.outputs.ndk-path }}"
          cat local.properties

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            fluxdns-engine/target/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk &> /dev/null; then
            echo "Installing cargo-ndk..."
            cargo install cargo-ndk
          else
            echo "cargo-ndk is already installed (restored from cache)"
          fi

      - name: Build FluxDNS Native Engine (Rust CDYLIB)
        run: |
          cd fluxdns-engine
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Create fallback .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, generating fallback debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -alias "androiddebugkey" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Generate Fallback Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "upload" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MNX DNS, OU=Development, O=MNX, L=Global, S=Global, C=US"

      - name: Build Android APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Locate and Package Artifacts
        run: |
          mkdir -p build-artifacts
          # Locate APK files and copy to artifacts directory
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/ \;

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mnx-dns-apks
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Extract App Version
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "1")
          
          BASE_TAG="v${VERSION_NAME}"
          TAG_NAME="$BASE_TAG"
          
          COUNTER=1
          while gh release view "$TAG_NAME" > /dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; do
            echo "Tag $TAG_NAME already exists. Finding next available..."
            TAG_NAME="${BASE_TAG}-b${COUNTER}"
            COUNTER=$((COUNTER+1))
          done
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Resolved Release Tag: $TAG_NAME (Version Code: $VERSION_CODE)"

      - name: Prepare Release Binaries
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-binaries
          TAG="${{ steps.get_version.outputs.tag_name }}"
          
          # Copy release APK if available
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-binaries/NEON-DNS-${TAG}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-binaries/NEON-DNS-${TAG}-release.apk"
          fi

          # Copy debug APK if available
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-binaries/NEON-DNS-${TAG}-debug.apk"
          fi

          # Fallback copy if paths differ
          if [ -z "$(ls -A release-binaries)" ]; then
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-binaries/ \;
          fi

          echo "Binaries prepared for release:"
          ls -la release-binaries/

      - name: Publish or Update GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.get_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.get_version.outputs.version_code }}
        run: |
          echo "✨ Creating new release for version $TAG_NAME..."

          RELEASE_BODY=$(cat << 'EOF'
          # ⚡ NEON DNS — Release

          Welcome to the official build release of **NEON DNS**! Built with an ultra-fast Rust native engine, intelligent resolver racing, and privacy-focused architecture.

          ### 🌟 Key Highlights & Engineering Features
          - 🚀 **Rust Native Engine (`libneon_dns_core.so`)**: High-performance packet processing and smart DNS resolving.
          - ⚡ **DNS Racing & Adaptive Selection**: Automatically selects the fastest and most stable resolver.
          - 🌐 **DNS-over-HTTPS & DNS-over-TLS**: Built-in DoH and DoT support via Rust.
          - 🎮 **Gaming & Anti-Censorship Shield**: Dedicated lower latency routing and custom DNS profiles.
          - 📊 **Real-time Telemetry & Diagnostics**: Live network monitoring, latency tracking, and packet inspection.

          ---
          ### 📦 Downloadable Assets
          - **`NEON-DNS-v*.apk`**: Production release build.
          - **`NEON-DNS-v*-debug.apk`**: Debug build for developer testing and log inspection.

          ---
          *Automated Release created by GitHub Actions CI/CD Pipeline.*
          EOF
          )

          gh release create "$TAG_NAME" release-binaries/*.apk \
            --title "⚡ NEON DNS $TAG_NAME (Build $VERSION_CODE)" \
            --notes "$RELEASE_BODY" \
            --latest

