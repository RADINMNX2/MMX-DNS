name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Create fallback .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Generate Fallback Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "upload" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MNX DNS, OU=Development, O=MNX, L=Global, S=Global, C=US"

      - name: Build Android APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Locate and Package Artifacts
        run: |
          mkdir -p build-artifacts
          # Locate APK files and copy to artifacts directory
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/ \;

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mnx-dns-apks
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
