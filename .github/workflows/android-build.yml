name: 🚀 Modern Android Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# جلوگیری از اجرای همزمان و لغو بیلدهای قدیمی روی یک Branch (صرفه‌جویی در منابع)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---------------------------------------------------------
  # 🛠 PROJECT CONFIGURATION (تغییرات فقط در این بخش انجام شود)
  # ---------------------------------------------------------
  APP_NAME: "MyAwesomeApp"
  RUST_PROJECT_DIR: "fluxdns-engine" # اگر پروژه Rust ندارید این قسمت‌ها را کامنت کنید
  RUST_TARGETS: "aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android"
  NDK_VERSION: "r26d"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.6" # نسخه پیشنهادی گریدل
  # ---------------------------------------------------------

jobs:
  build-and-release:
    name: 🛠 Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write # برای ساخت Release گیت‌هاب

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # برای دریافت تاریخچه کامل (مفید برای ورژن‌دهی)

      - name: ☕ Set up Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: ⚙️ Configure NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > local.properties

      # ---------------- RUST SECTION ----------------
      - name: 🦀 Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGETS }}

      - name: ⚡ Smart Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUST_PROJECT_DIR }}

      - name: 🚀 Install cargo-binstall & cargo-ndk (Ultra Fast)
        run: |
          # نصب binstall برای دانلود باینری از پیش کامپایل شده (نصب در ۲ ثانیه به جای ۵ دقیقه)
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-ndk -y

      - name: 🏗 Build Rust Native Engine
        working-directory: ${{ env.RUST_PROJECT_DIR }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../app/src/main/jniLibs build --release
      # ----------------------------------------------

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔧 Ensure Env Files
        run: |
          [ -f .env ] || { [ -f .env.example ] && cp .env.example .env || touch .env; }
          # ساخت گریدل رپر در صورت عدم وجود (توصیه میشود gradlew در مخزن کامیت شود)
          [ ! -f gradlew ] && gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} || true
          chmod +x gradlew

      - name: 🔨 Build Android APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 🔐 Sign Release APK (Professional Way)
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        # این مرحله فقط در صورت وجود سیکرت‌ها اجرا می‌شود
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: 🏷️ Extract App Version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"?\K[^"\n]+' app/build.gradle.kts || echo "1.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "1")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NAME-$VERSION_CODE" >> $GITHUB_ENV

      - name: 📂 Organize Artifacts
        run: |
          mkdir -p final-apks
          # انتقال APKهای ساخته شده با نام‌های استاندارد و جنریک
          find app/build/outputs/apk -name "*-debug.apk" -exec cp {} "final-apks/${{ env.APP_NAME }}-${{ env.TAG_NAME }}-debug.apk" \;
          
          # پیدا کردن فایل ریلیز (امضا شده یا امضا نشده)
          if ls app/build/outputs/apk/release/*-signed.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-signed.apk "final-apks/${{ env.APP_NAME }}-${{ env.TAG_NAME }}-release.apk"
          else
            find app/build/outputs/apk/release -name "*-unsigned.apk" -exec cp {} "final-apks/${{ env.APP_NAME }}-${{ env.TAG_NAME }}-release-unsigned.apk" \;
          fi

      - name: ☁️ Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APKs
          path: final-apks/*.apk
          retention-days: 7

      - name: 🚀 Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "⚡ ${{ env.APP_NAME }} ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          files: final-apks/*.apk
          body: |
            # ⚡ ${{ env.APP_NAME }} — Release `${{ env.VERSION_NAME }}`
            
            Welcome to the automated build for **${{ env.APP_NAME }}**.
            
            ### 📦 Downloadable Assets
            - `${{ env.APP_NAME }}-*-release.apk`: Production build (Optimized & Signed if keys provided).
            - `${{ env.APP_NAME }}-*-debug.apk`: Debug build for development and inspection.
            
            > _Auto-generated by GitHub Actions CI/CD Pipeline 🚀_
