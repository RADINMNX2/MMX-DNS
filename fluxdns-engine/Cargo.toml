[package]
name = "fluxdns"
version = "0.1.0"
edition = "2021"

[lib]
name = "fluxdns"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
tokio = { version = "1.35.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
lazy_static = "1.4.0"
once_cell = "1.18.0"
log = "0.4.20"
android_logger = "0.13.3"
reqwest = { version = "0.11.23", default-features = false, features = ["rustls-tls", "socks"] }
rustls = { version = "0.21.7", features = ["dangerous_configuration"] }
tokio-rustls = "0.24.1"
webpki-roots = "0.25.2"
libc = "0.2.151"
quiche = { version = "0.19.0", features = ["boringssl-vendored"] }
dashmap = "5.5.3"


